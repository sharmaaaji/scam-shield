<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 280px; padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  p { font-size: 12px; color: #555; margin: 0 0 12px; }
  label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 12px; margin-bottom: 8px; }
  button { width: 100%; padding: 8px; font-size: 12px; cursor: pointer; }
  #status { font-size: 11px; margin-top: 8px; color: #157347; height: 14px; }
</style>
</head>
<body>
  <h1>ScamShield</h1>
  <p>Flags likely scam/phishing messages in Gmail and WhatsApp Web automatically.</p>
  <label for="apiBase">Backend API URL</label>
  <input id="apiBase" type="text" placeholder="http://localhost:5090" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
